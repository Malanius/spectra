[package]
name = "spectra"
version = "0.1.0"
edition = "2021"
description = "Retro hi-fi spectrum analyzer for the terminal, powered by PipeWire"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
mpris = "2"
pipewire = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs" }
ratatui = "0.29"
realfft = "3"
ringbuf = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"

# Offline frame renderer (`spectra render`), a dev tool for tuning styles.
fontdue = { version = "0.9", optional = true }
hound = { version = "3", optional = true }
png = { version = "0.17", optional = true }

[features]
render = ["dep:fontdue", "dep:hound", "dep:png"]

[profile.release]
lto = true
strip = true
